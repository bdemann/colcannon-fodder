<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Colcannon Fodder - Art Style Lab</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <style>
            :root {
                --bg: #1e1b18;
                --fg: #f3e9d6;
                --mut: #a89c88;
                --acc: #e8b04a;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--fg);
                font:
                    14px/1.4 system-ui,
                    sans-serif;
            }
            header {
                padding: 14px 20px 0;
            }
            h1 {
                margin: 0 0 4px;
                font-size: 20px;
            }
            header p {
                margin: 0 0 10px;
                color: var(--mut);
                max-width: 900px;
            }
            nav {
                display: flex;
                gap: 6px;
                padding: 0 20px;
                flex-wrap: wrap;
                align-items: center;
            }
            nav button {
                background: #2c2722;
                color: var(--fg);
                border: 1px solid #4a4238;
                padding: 8px 16px;
                border-radius: 8px 8px 0 0;
                cursor: pointer;
                font: 600 14px system-ui;
            }
            nav button.on {
                background: var(--acc);
                color: #2b1a12;
                border-color: var(--acc);
            }
            nav .sp {
                flex: 1;
            }
            #pause {
                border-radius: 8px;
            }
            .sty {
                display: none;
                padding: 0 20px 30px;
            }
            .sty.on {
                display: block;
            }
            .desc {
                margin: 10px 0;
                color: var(--mut);
                max-width: 1000px;
            }
            .pal {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                margin: 8px 0 12px;
            }
            .sw {
                width: 64px;
                font-size: 10px;
                text-align: center;
                color: var(--mut);
            }
            .sw i {
                display: block;
                height: 28px;
                border-radius: 4px;
                border: 1px solid rgba(255, 255, 255, 0.2);
                margin-bottom: 2px;
            }
            canvas {
                display: block;
                border-radius: 10px;
                max-width: 100%;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Colcannon Fodder: Art Style Lab</h1>
            <p>
                Everything is drawn in code with Canvas 2D and animated purely by transforms
                (wobble, squash and stretch, bob, rotation, flap). No image files. Each drawing
                function takes
                <code>(ctx, style, state, time)</code>
                so it can be ported to Pixi Graphics.
            </p>
        </header>
        <nav id="tabs"></nav>
        <main id="main"></main>
        <script>
            'use strict';
            const TAU = Math.PI * 2,
                PI = Math.PI;
            const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
            const lerp = (a, b, t) => a + (b - a) * t;
            const seg = (p, a, b) => cl((p - a) / (b - a));
            const eo = (x) => 1 - Math.pow(1 - x, 3),
                ei = (x) => x * x * x;
            const ebk = (x) => {
                const k = 2.2;
                return 1 + (k + 1) * Math.pow(x - 1, 3) + k * Math.pow(x - 1, 2);
            };
            /* ---------- path builders (each returns f(ctx) with .b = bbox) ---------- */
            const withB = (f, b) => {
                f.b = b;
                return f;
            };
            const ell = (x, y, rx, ry, rot = 0) =>
                withB(
                    (c) => {
                        c.moveTo(x + Math.cos(rot) * rx, y + Math.sin(rot) * rx);
                        c.ellipse(x, y, rx, ry, rot, 0, TAU);
                    },
                    [
                        x - rx,
                        y - ry,
                        2 * rx,
                        2 * ry,
                    ],
                );
            const circ = (x, y, r) => ell(x, y, r, r);
            const rr = (x, y, w, h, r) =>
                withB(
                    (c) => c.roundRect(x, y, w, h, r),
                    [
                        x,
                        y,
                        w,
                        h,
                    ],
                );
            const poly = (pts) => {
                const xs = pts.map((p) => p[0]),
                    ys = pts.map((p) => p[1]),
                    x0 = Math.min(...xs),
                    y0 = Math.min(...ys);
                return withB(
                    (c) => {
                        pts.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])));
                        c.closePath();
                    },
                    [
                        x0,
                        y0,
                        Math.max(...xs) - x0,
                        Math.max(...ys) - y0,
                    ],
                );
            };
            const multi = (b, ...fs) => withB((c) => fs.forEach((f) => f(c)), b);
            const blob = (rx, ry, k = 0.05, n = 5, ph = 0) =>
                withB(
                    (c) => {
                        for (let i = 0; i <= 48; i++) {
                            const a = (i / 48) * TAU,
                                m = 1 + k * Math.sin(n * a + ph);
                            const x = Math.cos(a) * rx * m,
                                y = Math.sin(a) * ry * m;
                            i ? c.lineTo(x, y) : c.moveTo(x, y);
                        }
                        c.closePath();
                    },
                    [
                        -rx * 1.1,
                        -ry * 1.1,
                        rx * 2.2,
                        ry * 2.2,
                    ],
                );
            const mashBlob = (r) =>
                multi(
                    [
                        -1.25 * r,
                        -1.15 * r,
                        2.5 * r,
                        2.2 * r,
                    ],
                    circ(-0.45 * r, 0, 0.8 * r),
                    circ(0.45 * r, 0, 0.8 * r),
                    circ(0, -0.35 * r, 0.8 * r),
                    circ(0, 0.3 * r, 0.7 * r),
                );
            const starPath = (R, r, n = 5) => {
                const pts = [];
                for (let i = 0; i < n * 2; i++) {
                    const a = -PI / 2 + (i * PI) / n,
                        q = i % 2 ? r : R;
                    pts.push([
                        Math.cos(a) * q,
                        Math.sin(a) * q,
                    ]);
                }
                return poly(pts);
            };

            /* ---------- the one primitive every style shares ---------- */
            function P(c, S, col, path, o = {}) {
                c.save();
                c.beginPath();
                path(c);
                c.lineJoin = 'round';
                c.lineCap = 'round';
                if (o.a != null) c.globalAlpha *= o.a;
                const D = S.dpr,
                    sh = o.sh && S.shadow;
                const setSh = () => {
                    if (sh) {
                        c.shadowColor = S.shc;
                        c.shadowBlur = S.shadow.b * D;
                        c.shadowOffsetX = (S.shadow.x || 0) * D;
                        c.shadowOffsetY = S.shadow.y * D;
                    }
                };
                const noSh = () => {
                    c.shadowColor = 'transparent';
                    c.shadowBlur = 0;
                    c.shadowOffsetX = 0;
                    c.shadowOffsetY = 0;
                };
                if (S.ol > 0 && o.ol !== 0) {
                    setSh();
                    c.lineWidth = 2 * S.ol * (o.olw || 1);
                    c.strokeStyle = o.olc || S.olc;
                    c.stroke();
                    noSh();
                    c.fillStyle = col;
                    c.fill();
                } else {
                    setSh();
                    c.fillStyle = col;
                    c.fill();
                    noSh();
                }
                if (!o.flat && path.b && (S.hl > 0 || S.shade > 0)) {
                    const b = path.b;
                    c.clip();
                    const g = c.createLinearGradient(b[0], b[1], b[0] + b[2] * 0.7, b[1] + b[3]);
                    g.addColorStop(0, `rgba(255,255,255,${S.hl})`);
                    g.addColorStop(0.45, 'rgba(255,255,255,0)');
                    g.addColorStop(1, `rgba(${S.shadeC},${S.shade})`);
                    c.fillStyle = g;
                    c.fillRect(b[0] - 3, b[1] - 3, b[2] + 6, b[3] + 6);
                }
                c.restore();
            }
            /** Stroked line/curve with optional outline halo (style aware). */
            function L(c, S, col, w, path, o = {}) {
                c.save();
                c.beginPath();
                path(c);
                c.lineJoin = 'round';
                c.lineCap = 'round';
                if (o.a != null) c.globalAlpha *= o.a;
                if (S.ol > 0 && o.ol) {
                    c.lineWidth = w + 2 * S.ol * 0.6;
                    c.strokeStyle = S.olc;
                    c.stroke();
                }
                c.lineWidth = w;
                c.strokeStyle = col;
                c.stroke();
                c.restore();
            }
            const mv =
                (...p) =>
                (c) => {
                    c.moveTo(p[0], p[1]);
                    for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]);
                };
            /** Soft/hard/subtle ground shadow, style dependent. */
            function gsh(c, S, rx, ry, y = 0, k = 1) {
                c.save();
                c.globalAlpha *= k;
                if (S.gshadow === 'hard') {
                    c.fillStyle = 'rgba(0,0,0,.3)';
                    c.beginPath();
                    c.ellipse(3, y + 3, rx, ry, 0, 0, TAU);
                    c.fill();
                } else {
                    c.translate(0, y);
                    c.scale(1, ry / rx);
                    const g = c.createRadialGradient(0, 0, 0, 0, 0, rx);
                    g.addColorStop(0, `rgba(${S.shadeC},${S.gshadow === 'soft' ? 0.38 : 0.2})`);
                    g.addColorStop(1, `rgba(${S.shadeC},0)`);
                    c.fillStyle = g;
                    c.beginPath();
                    c.arc(0, 0, rx, 0, TAU);
                    c.fill();
                }
                c.restore();
            }
            function shine(c, S, x, y, rx, ry, rot = -0.5, k = 1) {
                if (S.shine <= 0) return;
                c.save();
                c.globalAlpha *= S.shine * k;
                c.fillStyle = '#fff';
                c.beginPath();
                c.ellipse(x, y, rx, ry, rot, 0, TAU);
                c.fill();
                c.restore();
            }
            function txt(c, S, s, x, y, size = 13, col = S.text, al = 'center') {
                c.save();
                c.font = `${S.fontW} ${size}px ${S.font}`;
                c.fillStyle = col;
                c.textAlign = al;
                c.textBaseline = 'middle';
                c.fillText(s, x, y);
                c.restore();
            }

            /* ---------- faces ---------- */
            function face(c, S, r, t, mood, ph = 0) {
                if (!S.face) return;
                const p = S.pal,
                    blink = (t + ph) % 3.4 < 0.12,
                    ex = r * 0.3,
                    ey = -r * 0.05;
                if (S.face === 1) {
                    // tiny dot eyes + blush
                    for (const s of [
                        -1,
                        1,
                    ]) {
                        if (blink || mood === 'happy')
                            L(c, S, p.ink, r * 0.07, (c) => {
                                c.arc(s * ex, ey + r * 0.02, r * 0.09, PI * 1.1, PI * 1.9);
                            });
                        else P(c, S, p.ink, circ(s * ex, ey, r * 0.075), {ol: 0});
                        if (mood !== 'angry')
                            P(c, S, p.blush, circ(s * r * 0.5, ey + r * 0.2, r * 0.12), {
                                ol: 0,
                                flat: 1,
                                a: 0.55,
                            });
                    }
                    if (mood === 'happy' || mood === 'calm')
                        L(c, S, p.ink, r * 0.05, (c) => {
                            c.arc(0, ey + r * 0.12, r * 0.1, 0.2, PI - 0.2);
                        });
                    return;
                }
                const er = r * 0.2;
                for (const s of [
                    -1,
                    1,
                ]) {
                    const x = s * ex;
                    if (blink) {
                        L(c, S, p.ink, r * 0.07, mv(x - er * 0.7, ey, x + er * 0.7, ey));
                        continue;
                    }
                    if (mood === 'happy') {
                        L(c, S, p.ink, r * 0.1, (c) => {
                            c.arc(x, ey + er * 0.4, er * 0.8, PI * 1.1, PI * 1.9);
                        });
                        continue;
                    }
                    P(c, S, '#fff', circ(x, ey, er), {olw: 0.55});
                    const px = Math.sin(t * 1.7 + ph) * er * 0.25,
                        py = mood === 'dazed' ? Math.cos(t * 5) * er * 0.3 : 0;
                    P(c, S, p.ink, circ(x + px + s * er * 0.1, ey + py, er * 0.5), {ol: 0});
                    P(c, S, '#fff', circ(x + px - er * 0.1, ey + py - er * 0.2, er * 0.17), {
                        ol: 0,
                        flat: 1,
                    });
                    if (mood === 'angry')
                        L(
                            c,
                            S,
                            p.ink,
                            r * 0.1,
                            mv(
                                x - s * er * 1.3,
                                ey - er * 1.5 - s * er * 0.0,
                                x + s * er * 0.4,
                                ey - er * 0.9,
                            ),
                        );
                    if (mood === 'angry' && s === 1) {
                    }
                }
                if (mood === 'angry')
                    L(c, S, p.ink, r * 0.07, (c) => {
                        c.arc(0, ey + r * 0.42, r * 0.14, PI * 1.15, PI * 1.85);
                    });
                else if (mood === 'dazed')
                    L(c, S, p.ink, r * 0.06, (c) => {
                        c.moveTo(-r * 0.12, ey + r * 0.3);
                        c.bezierCurveTo(
                            -r * 0.05,
                            ey + r * 0.24,
                            r * 0.05,
                            ey + r * 0.36,
                            r * 0.12,
                            ey + r * 0.3,
                        );
                    });
                else
                    L(c, S, p.ink, r * 0.07, (c) => {
                        c.arc(0, ey + r * 0.2, r * 0.14, 0.15, PI - 0.15);
                    });
                if (mood !== 'angry')
                    for (const s of [
                        -1,
                        1,
                    ])
                        P(c, S, p.blush, circ(s * r * 0.55, ey + r * 0.28, r * 0.11), {
                            ol: 0,
                            flat: 1,
                            a: 0.5,
                        });
            }

            /* ---------- toppings (on a mash of radius r) ---------- */
            function toppings(c, S, r, top, t) {
                const p = S.pal;
                if (!top) return;
                if (top.gravy) {
                    const br = 1 + Math.sin(t * 2) * 0.02;
                    P(
                        c,
                        S,
                        p.gravy,
                        multi(
                            [
                                -r * 0.8,
                                -r * 0.5,
                                r * 1.6,
                                r,
                            ],
                            ell(0, -r * 0.12, r * 0.72 * br, r * 0.36 * br),
                            circ(-r * 0.5, r * 0.12, r * 0.14),
                            circ(r * 0.3, r * 0.2, r * 0.18),
                            circ(r * 0.62, r * 0.0, r * 0.12),
                        ),
                        {olw: 0.6},
                    );
                    shine(c, S, -r * 0.25, -r * 0.24, r * 0.22, r * 0.07, -0.2, 0.8);
                    P(c, S, p.gravyL, ell(r * 0.15, -r * 0.08, r * 0.2, r * 0.07), {
                        ol: 0,
                        flat: 1,
                        a: 0.5,
                    });
                }
                if (top.cabbage)
                    for (const [
                        x,
                        y,
                        a,
                    ] of [
                        [
                            -0.45,
                            0.18,
                            -0.5,
                        ],
                        [
                            0.38,
                            0.28,
                            0.4,
                        ],
                    ]) {
                        c.save();
                        c.translate(x * r, y * r);
                        c.rotate(a);
                        P(c, S, p.cab, ell(0, 0, r * 0.34, r * 0.2), {olw: 0.6});
                        L(c, S, p.cabD, Math.max(1.2, r * 0.05), mv(-r * 0.28, 0, r * 0.26, 0));
                        L(
                            c,
                            S,
                            p.cabD,
                            Math.max(1, r * 0.035),
                            mv(-r * 0.08, 0, r * 0.04, -r * 0.1),
                        );
                        L(
                            c,
                            S,
                            p.cabD,
                            Math.max(1, r * 0.035),
                            mv(-r * 0.08, 0, r * 0.04, r * 0.1),
                        );
                        c.restore();
                    }
                if (top.scallion)
                    for (const [
                        x,
                        y,
                        a,
                    ] of [
                        [
                            -0.3,
                            -0.55,
                            -0.6,
                        ],
                        [
                            0,
                            -0.62,
                            0,
                        ],
                        [
                            0.3,
                            -0.55,
                            0.6,
                        ],
                        [
                            0.1,
                            -0.35,
                            0.9,
                        ],
                    ]) {
                        c.save();
                        c.translate(x * r, y * r);
                        c.rotate(a);
                        L(c, S, p.scalD, r * 0.16, mv(0, 0, 0, -r * 0.3), {ol: 1});
                        L(c, S, p.scal, r * 0.09, mv(0, 0, 0, -r * 0.3));
                        c.restore();
                    }
                if (top.scallion)
                    for (const [
                        x,
                        y,
                    ] of [
                        [
                            -0.55,
                            -0.2,
                        ],
                        [
                            0.55,
                            -0.15,
                        ],
                        [
                            0,
                            -0.15,
                        ],
                    ]) {
                        P(c, S, p.scal, circ(x * r, y * r, r * 0.09), {olw: 0.5});
                        P(c, S, p.mash, circ(x * r, y * r, r * 0.04), {ol: 0, flat: 1});
                    }
                if (top.butter) {
                    const jig = Math.sin(t * 2.2) * 0.5;
                    P(c, S, p.butterD, rr(-r * 0.3, -r * 0.55 + jig, r * 0.6, r * 0.44, r * 0.1), {
                        sh: 1,
                        olw: 0.7,
                    });
                    P(c, S, p.butter, rr(-r * 0.3, -r * 0.62 + jig, r * 0.6, r * 0.36, r * 0.1), {
                        olw: 0.7,
                    });
                    shine(c, S, -r * 0.12, -r * 0.5 + jig, r * 0.12, r * 0.05, 0, 0.9);
                    P(c, S, p.butter, ell(r * 0.1, -r * 0.08 + jig, r * 0.14, r * 0.05), {
                        ol: 0,
                        flat: 1,
                        a: 0.6,
                    });
                }
            }

            /* ---------- potatoes ---------- */
            const potatoLabels = {
                raw: 'Raw',
                cut: 'Sliced (cut)',
                boiled: 'Boiled',
                half: 'Half-mashed',
                perfect: 'Perfect mash',
                king: 'Russet King',
            };
            function potato(c, S, o, t) {
                const {kind, r, top, ph = 0} = o,
                    p = S.pal;
                const h = Math.abs(Math.sin(t * 3.2 + ph)),
                    land = Math.pow(1 - h, 4);
                const sy = 1 - S.sq * land + S.sq * 0.45 * h,
                    sx = 1 / sy,
                    dy = -h * r * S.hop,
                    rot = S.wob * Math.sin(t * 3.1 + ph * 1.3);
                gsh(c, S, r * 1.2, r * 0.4, r * 0.95, 1 - h * 0.35);
                c.save();
                c.translate(0, dy);
                c.rotate(rot);
                c.translate(0, r * 0.9);
                c.scale(sx, sy);
                c.translate(0, -r * 0.9);
                const mashy = kind === 'half' || kind === 'perfect';
                if (kind === 'raw' || kind === 'cut') {
                    P(c, S, p.raw, blob(r * 1.2, r * 0.9, 0.05, 5, ph), {sh: 1});
                    shine(c, S, -r * 0.4, -r * 0.4, r * 0.35, r * 0.14);
                    for (const [
                        x,
                        y,
                    ] of [
                        [
                            -0.55,
                            -0.1,
                        ],
                        [
                            0.45,
                            0.3,
                        ],
                        [
                            0.2,
                            -0.5,
                        ],
                        [
                            -0.1,
                            0.45,
                        ],
                    ])
                        P(c, S, p.rawD, circ(x * r, y * r, Math.max(1.3, r * 0.06)), {
                            ol: 0,
                            flat: 1,
                        });
                    if (kind === 'cut') {
                        c.save();
                        c.beginPath();
                        blob(r * 1.2, r * 0.9, 0.05, 5, ph)(c);
                        c.clip();
                        for (const x of [
                            -0.4,
                            0.4,
                        ]) {
                            L(c, S, p.cut, Math.max(2.5, r * 0.14), mv(x * r, -r, x * r, r));
                            L(
                                c,
                                S,
                                p.cutL,
                                Math.max(1, r * 0.05),
                                mv(x * r + r * 0.12, -r, x * r + r * 0.12, r),
                            );
                        }
                        c.restore();
                    }
                } else if (kind === 'boiled') {
                    P(c, S, p.boiled, blob(r * 1.2, r * 0.9, 0.03, 4, ph), {sh: 1});
                    shine(c, S, -r * 0.4, -r * 0.4, r * 0.38, r * 0.15, -0.5, 1.1);
                    for (const [
                        x,
                        y,
                    ] of [
                        [
                            -0.5,
                            0.35,
                        ],
                        [
                            0.4,
                            0.2,
                        ],
                    ])
                        P(c, S, p.glue, circ(x * r, y * r, r * 0.07), {ol: 0, flat: 1, a: 0.7});
                } else if (kind === 'half') {
                    P(c, S, p.glue, mashBlob(r), {sh: 1});
                    for (const [
                        x,
                        y,
                        a,
                    ] of [
                        [
                            -0.6,
                            -0.2,
                            0.5,
                        ],
                        [
                            0.15,
                            -0.55,
                            -0.3,
                        ],
                        [
                            0.55,
                            0.2,
                            1,
                        ],
                        [
                            -0.2,
                            0.35,
                            0,
                        ],
                    ]) {
                        c.save();
                        c.translate(x * r, y * r);
                        c.rotate(a);
                        P(c, S, p.raw, blob(r * 0.3, r * 0.2, 0.1, 3, x), {olw: 0.55});
                        c.restore();
                    }
                    L(
                        c,
                        S,
                        p.rawD,
                        Math.max(1.2, r * 0.06),
                        (c) => {
                            c.moveTo(-r * 0.6, r * 0.15);
                            c.quadraticCurveTo(-r * 0.3, r * 0.0, 0, r * 0.15);
                            c.quadraticCurveTo(r * 0.3, r * 0.3, r * 0.6, r * 0.1);
                        },
                        {a: 0.5},
                    );
                } else if (kind === 'perfect') {
                    P(c, S, p.mash, mashBlob(r), {sh: 1});
                    P(
                        c,
                        S,

            const towerFns = {

            /* ---------- seagull (polished from the current design: egg body, swept wings, orange beak and legs) ---------- */
            function wingPath(s, d) {
                // d = -1 upper wing, +1 lower wing; s = flap extension 0..1
                const y = (v) => d * v * s;
                return withB(
                    (c) => {
                        c.moveTo(9, d * 3);
                        c.bezierCurveTo(9, y(22), 0, y(34), -9, y(38));
                        c.lineTo(-15, y(33));
                        c.quadraticCurveTo(-14, y(26), -21, y(26));
                        c.quadraticCurveTo(-17, y(19), -24, y(17));
                        c.quadraticCurveTo(-18, y(10), -19, d * 4);
                        c.closePath();
                    },
                    [
                        -24,
                        Math.min(0, d * 38 * s),
                        33,
                        38 * s,
                    ],
                );
            }
            function wingTip(s, d) {
                const y = (v) => d * v * s;
                return withB(
                    (c) => {
                        c.moveTo(-1, y(31));
                        c.lineTo(-9, y(38));
                        c.lineTo(-15, y(33));
                        c.quadraticCurveTo(-14, y(26), -21, y(26));
                        c.lineTo(-8, y(26));
                        c.closePath();
                    },
                    [
                        -21,
                        0,
                        20,
                        38 * s,
                    ],
                );
            }
            function gull(c, S, o, t) {
                const p = S.pal,
                    mode = o.mode,
                    fly = mode !== 'walk';
                const ph = t * (fly ? 11 : 7),
                    fl = fly ? 0.25 + 0.75 * Math.abs(Math.sin(ph)) : 0.0;
                const bob = fly ? -Math.sin(ph) * 2.5 : -Math.abs(Math.sin(ph)) * 2.5,
                    rot = fly ? Math.sin(ph) * 0.03 : Math.sin(ph) * 0.12;
                // shadow: flying gull's shadow falls well below and breathes with the flap
                c.save();
                c.scale(1.5, 1.5);
                if (fly) gsh(c, S, 28, 10, 36 + 8 * fl, 0.75 - 0.25 * fl);
                else gsh(c, S, 24, 7, 20);
                c.restore();
                c.save();
                c.scale(1.5, 1.5);
                c.save();
                c.translate(0, bob);
                c.rotate(rot);
                if (!fly) {
                    // waddling legs
                    for (const [
                        i,
                        x,
                    ] of [
                        [
                            0,
                            -5,
                        ],
                        [
                            1,
                            5,
                        ],
                    ]) {
                        const sw = Math.sin(ph + i * PI) * 4,
                            lift = Math.max(0, Math.cos(ph + i * PI)) * 3;
                        L(c, S, p.beak, 3, mv(x, 7, x + sw * 0.5, 19 - lift), {ol: 1});
                        P(
                            c,
                            S,
                            p.beak,
                            poly([
                                [
                                    x + sw * 0.5 - 1,
                                    19 - lift,
                                ],
                                [
                                    x + sw * 0.5 + 9,
                                    20 - lift,
                                ],
                                [
                                    x + sw * 0.5 - 2,
                                    22 - lift,
                                ],
                            ]),
                            {olw: 0.5},
                        );
                    }
                } else if (mode === 'carry') {
                    for (const x of [
                        -4,
                        5,
                    ])
                        L(c, S, p.beak, 2.6, mv(x, 8, x * 0.8 + 4, 20), {ol: 1});
                } else {
                    L(c, S, p.beak, 2.4, mv(-4, 9, -9, 14), {ol: 1});
                    L(c, S, p.beak, 2.4, mv(4, 9, -4, 15), {ol: 1});
                }
                const wf = fly ? fl : 0.0;
                if (fly) {
                    for (const d of [
                        -1,
                        1,
                    ]) {
                        P(c, S, p.gullWing, wingPath(Math.max(0.1, fl), d), {sh: 1, olw: 0.8});
                        P(c, S, p.gullTip, wingTip(Math.max(0.1, fl), d), {ol: 0, flat: 1});
                    }
                }
                // tail
                P(
                    c,
                    S,
                    p.gullWing,
                    poly([
                        [
                            -16,
                            -5,
                        ],
                        [
                            -33,
                            -3,
                        ],
                        [
                            -34,
                            3,
                        ],
                        [
                            -16,
                            6,
                        ],
                    ]),
                    {olw: 0.8},
                );
                P(c, S, p.gullTip, rr(-34, -3, 4, 6, 1), {ol: 0, flat: 1});
                // body + head
                P(c, S, p.gull, ell(0, 0, 22, 13), {sh: !fly ? 1 : 0, olw: 1});
                P(c, S, p.gull, circ(14, -5, 9), {olw: 1});
                P(c, S, p.gull, ell(6, -1, 14, 10), {ol: 0, flat: 1});
                shine(c, S, -4, -7, 9, 3, -0.2, 0.6);
                if (!fly) {
                    // folded wing on the flank
                    P(
                        c,
                        S,
                        p.gullWing,
                        withB(
                            (c) => {
                                c.moveTo(8, -3);
                                c.bezierCurveTo(0, -9, -14, -8, -27, -2);
                                c.lineTo(-19, 5);
                                c.bezierCurveTo(-8, 8, 2, 6, 8, -3);
                            },
                            [
                                -27,
                                -9,
                                35,
                                17,
                            ],
                        ),
                        {olw: 0.9},
                    );
                    P(
                        c,
                        S,
                        p.gullTip,
                        poly([
                            [
                                -27,
                                -2,
                            ],
                            [
                                -19,
                                5,
                            ],
                            [
                                -14,
                                1,
                            ],
                            [
                                -20,
                                -3,
                            ],
                        ]),
                        {ol: 0, flat: 1},
                    );
                }
                // beak, eye
                P(
                    c,
                    S,
                    p.beak,
                    poly([
                        [
                            21,
                            -8,
                        ],
                        [
                            34,
                            -4,
                        ],
                        [
                            21,
                            -1,
                        ],
                    ]),
                    {olw: 0.85},
                );
                P(c, S, p.red, circ(27, -3.2, 1.3), {ol: 0, flat: 1});
                const bl = t % 3.1 < 0.1;
                if (bl) L(c, S, p.ink, 1.5, mv(14, -8, 19, -8));
                else {
                    P(c, S, p.ink, circ(17, -8, 2.5), {ol: 0});
                    P(c, S, '#fff', circ(17.8, -8.8, 0.9), {ol: 0, flat: 1});
                }
                if (mode === 'carry') {
                    // potato held in the feet
                    c.save();
                    c.translate(2, 36);
                    c.rotate(Math.sin(ph * 0.5) * 0.25);
                    c.translate(0, -0);
                    potato(
                        c,
                        {...S, face: S.face, hop: 0, sq: S.sq * 0.3, wob: 0},
                        {kind: 'raw', r: 10, ph: 1},
                        t,
                    );
                    c.restore();
                    L(c, S, p.beak, 2.4, mv(0, 12, 0, 28), {ol: 1});
                }
                c.restore();
                c.restore();
            }

            /* ---------- restaurant counter + hopper ---------- */
            function restaurant(c, S, t) {
                const p = S.pal;
                gsh(c, S, 130, 18, 62);
                P(c, S, p.wall, rr(-120, -48, 240, 108, 6), {sh: 1});
                P(c, S, p.dark, rr(-90, -24, 180, 52, 6), {olw: 0.9});
                // heat lamp glow behind plate
                const gl = 0.55 + 0.1 * Math.sin(t * 3) + 0.05 * Math.sin(t * 7.3);
                c.save();
                c.beginPath();
                rr(-90, -24, 180, 52, 6)(c);
                c.clip();
                const g = c.createRadialGradient(0, 12, 2, 0, 12, 76);
                g.addColorStop(0, p.lamp);
                g.addColorStop(1, 'rgba(255,170,60,0)');
                c.globalAlpha = gl;
                c.fillStyle = g;
                c.fillRect(-90, -24, 180, 52);
                c.restore();
                // lamp hood + arm
                L(
                    c,
                    S,
                    p.steelD,
                    4,
                    (c) => {
                        c.moveTo(-70, -24);
                        c.lineTo(-70, -12);
                        c.quadraticCurveTo(-70, -4, -48, -4);
                    },
                    {ol: 1},
                );
                P(
                    c,
                    S,
                    p.steel,
                    poly([
                        [
                            -58,
                            -14,
                        ],
                        [
                            -28,
                            -14,
                        ],
                        [
                            -20,
                            -2,
                        ],
                        [
                            -66,
                            -2,
                        ],
                    ]),
                    {sh: 1, olw: 0.9},
                );
                P(c, S, p.lamp, ell(-43, -1, 15, 3), {
                    ol: 0,
                    flat: 1,
                    a: 0.6 + 0.4 * Math.sin(t * 7),
                });
                c.save();
                c.globalAlpha = 0.25 * gl;
                P(
                    c,
                    S,
                    p.lamp,
                    poly([
                        [
                            -62,
                            0,
                        ],
                        [
                            -24,
                            0,
                        ],
                        [
                            -8,
                            26,
                        ],
                        [
                            -78,
                            26,
                        ],
                    ]),
                    {ol: 0, flat: 1},
                );
                c.restore();
                // plate with perfect mash
                c.save();
                c.translate(-43, 16);
                P(c, S, '#fff', ell(0, 6, 22, 6), {olw: 0.8});
                c.scale(0.9, 0.9);
                c.restore();
                c.save();
                c.translate(-43, 9);
                c.scale(0.55, 0.55 * (1 + Math.sin(t * 2) * 0.02));
                P(c, S, p.mash, mashBlob(14), {olw: 1.4});
                shine(c, S, -5, -5, 6, 2.5, -0.4, 0.9);
                c.restore();
                // steam from mash
                for (let i = 0; i < 2; i++) {
                    const u = (t * 0.5 + i / 2) % 1;
                    c.save();
                    c.globalAlpha *= (1 - u) * 0.6;
                    P(c, S, p.steam, circ(-43 + Math.sin(u * 5 + i) * 4, -4 - u * 14, 3 + u * 3), {
                        ol: 0,
                        flat: 1,
                    });
                    c.restore();
                }
                // second plate + bell
                P(c, S, '#fff', ell(30, 16, 20, 5.5), {olw: 0.8});
                P(
                    c,
                    S,
                    p.steel,
                    withB(
                        (c) => {
                            c.moveTo(14, 16);
                            c.bezierCurveTo(14, -2, 46, -2, 46, 16);
                            c.closePath();
                        },
                        [
                            14,
                            0,
                            32,
                            16,
                        ],
                    ),
                    {olw: 0.9},
                );
                P(c, S, p.steelD, circ(30, 3, 2.5), {olw: 0.5});
                // counter
                P(c, S, p.wood, rr(-124, 26, 248, 14, 4), {sh: 1});
                P(c, S, p.woodD, rr(-124, 34, 248, 6, 3), {ol: 0, flat: 1, a: 0.6});
                // awning
                const n = 8,
                    w = 240 / n;
                for (let i = 0; i < n; i++)
                    P(
                        c,
                        S,
                        i % 2 ? p.roof2 : p.roof,
                        withB(
                            (c) => {
                                const x = -120 + i * w;
                                c.moveTo(x, -48);
                                c.lineTo(x + w, -48);
                                c.lineTo(x + w + 3, -30);
                                c.arc(x + w / 2, -30, w / 2 + 3, 0, PI);
                                c.closePath();
                            },
                            [
                                -123 + i * w,
                                -48,
                                w + 6,
                                30 + w / 2,
                            ],
                        ),
                        {olw: 0.9, sh: i === 0 ? 1 : 0},
                    );
                P(c, S, p.roof, rr(-124, -62, 248, 16, 5), {sh: 1});
                txt(c, S, 'MASH BAR', 0, -54, 12, p.ink);
                P(c, S, p.red, rr(70, 40, 0, 0, 0), {ol: 0});
            }
            function hopper(c, S, t) {
                const p = S.pal;
                gsh(c, S, 40, 10, 50);
                const T = (t * 0.55) % 1;
                let y = lerp(-72, 60, ei(T * 1.0)),
                    vis = true;
                const sy = 1 + 0.25 * T,
                    sx = 1 / sy;
                // back wall of funnel
                P(c, S, p.dark, ell(0, -30, 34, 9), {olw: 0.8});
                const drawPot = () => {
                    c.save();
                    c.translate(0, y);
                    c.scale(sx, sy);
                    potato(c, {...S, hop: 0, wob: 0, sq: 0}, {kind: 'raw', r: 9, ph: 2}, 0);
                    c.restore();
                };
                if (y < -30) drawPot();
                P(
                    c,
                    S,
                    p.steel,
                    poly([
                        [
                            -34,
                            -30,
                        ],
                        [
                            34,
                            -30,
                        ],
                        [
                            10,
                            0,
                        ],
                        [
                            10,
                            28,
                        ],
                        [
                            -10,
                            28,
                        ],
                        [
                            -10,
                            0,
                        ],
                    ]),
                    {sh: 1, olw: 1},
                );
                shine(c, S, -20, -18, 4, 10, 0.5, 0.8);
                P(c, S, p.steelD, rr(-14, 22, 28, 8, 3), {olw: 0.8});
                P(c, S, p.steel, ell(0, -30, 34, 9), {ol: 0, flat: 1, a: 0.0});
                L(
                    c,
                    S,
                    p.steelD,
                    3,
                    (c) => {
                        c.ellipse(0, -30, 34, 9, 0, PI, TAU);
                    },
                    {ol: 1},
                );
                if (y >= -30 && y < 30) {
                    /* hidden inside the chute */
                }
                if (y >= 30) drawPot();
                if (T > 0.88) {
                    const u = seg(T, 0.88, 1);
                    c.save();
                    c.globalAlpha *= 1 - u;
                    P(c, S, p.mash, ell(0, 66, 14 + u * 8, 4 + u * 2), {ol: 0, flat: 1});
                    c.restore();
                }
            }

            /* ---------- icons ---------- */
            function coin(c, S, t) {
                const p = S.pal,
                    sx = Math.max(0.3, Math.abs(Math.cos(t * 2.2))),
                    bob = Math.sin(t * 3) * 3;
                gsh(c, S, 20, 6, 34, 0.8);
                c.save();
                c.translate(0, bob);
                c.scale(sx, 1);
                P(c, S, p.gold, circ(0, 0, 22), {sh: 1, olw: 1});
                P(c, S, p.goldD, circ(0, 0, 16), {olw: 0.55, flat: 1});
                P(c, S, p.gold, circ(0, 0, 14), {ol: 0});
                txt(c, S, 'C', 0, 1, 20, p.goldD);
                shine(c, S, -8, -9, 7, 3, -0.7, 1);
                c.restore();

            function star(c, S, t) {
                const p = S.pal,
                    s = 1 + Math.sin(t * 3) * 0.1;
                gsh(c, S, 22, 6, 34, 0.8);
                c.save();
                c.translate(0, Math.sin(t * 2.4) * 2);
                c.rotate(Math.sin(t * 2) * 0.18);
                c.scale(s, s);
                P(c, S, p.gold, starPath(26, 12), {sh: 1, olw: 1});
                P(c, S, '#fff', starPath(10, 5), {ol: 0, flat: 1, a: 0.28});
                shine(c, S, -7, -9, 5, 2, -0.8, 0.9);
                c.restore();
                for (let i = 0; i < 3; i++) {
                    const u = (t * 0.8 + i / 3) % 1;
                    c.save();
                    c.globalAlpha *= Math.sin(u * PI);
                    P(c, S, '#fff', starPath(5 * u + 2, 1.5), {ol: 0, flat: 1});
                    c.restore();
                }
            }

                c.rotate(-0.78 + Math.sin(t * 3) * 0.22);

                P(
                    c,
                    S,

                        (c) => {
                            c.moveTo(5, -15);
                            c.lineTo(5, -33);
                            c.arc(0, -22, 13, -1.176, 4.317);
                            c.lineTo(-5, -15);

                        [
                            -13,
                            -35,
                            26,
                            26,
                        ],
                    ),
                    {sh: 1, olw: 0.9},

                shine(c, S, -8, -24, 2.5, 6, 0, 0.9);
                c.restore();
            }

            /* ---------- layout of the sheet ---------- */
            const U = 150,
                W = 1200,
                CH = 172;
            function sheet(S) {
                const pot = (kind, r, top, ph) => (c, t) => potato(c, S, {kind, r, top, ph}, t);
                const pair = (fn) => (c, t) => {
                    c.save();
                    c.translate(-U / 2, 6);
                    c.scale(1.1, 1.1);
                    fn(c, -1, t);
                    c.restore();
                    txt(c, S, 'idle', -U / 2, -80, 11, S.text);
                    c.save();
                    c.translate(U / 2, 6);
                    c.scale(1.1, 1.1);
                    fn(c, (t % 1.3) / 1.3, t);
                    c.restore();
                    txt(c, S, 'attack', U / 2, -80, 11, S.text);
                };
                const tw = (name) => ({
                    l: name,
                    w: 2,
                    h: 196,
                    d: pair((c, a, t) => towerFns[name](c, S, a, t)),
                });
                return [
                    {sec: 'Potatoes: cooking states and sizes (each hops, squashes and wobbles)'},
                    {l: 'Raw (small)', d: pot('raw', 13, 0, 0)},
                    {l: 'Raw (medium)', d: pot('raw', 19, 0, 1.1)},
                    {l: 'Raw (large)', d: pot('raw', 26, 0, 2.2)},
                    {l: 'Sliced (cut)', d: pot('cut', 20, 0, 0.7)},
                    {l: 'Boiled (steaming)', d: pot('boiled', 20, 0, 1.6)},
                    {l: 'Half-mashed blob', d: pot('half', 20, 0, 2.6)},
                    {l: 'Perfect mash', d: pot('perfect', 20, 0, 0.3)},
                    {l: 'Russet King (boss)', d: pot('king', 36, 0, 0)},
                    {sec: 'Conveyor belt corner with potatoes riding and wobbling'},
                    {
                        l: 'Belt (moving stripes, one corner)',
                        w: 8,
                        h: 196,
                        d: (c, t) => {
                            const x0 = -U * 3.9,
                                x1 = U * 2.7,
                                y0 = -30,
                                y1 = 110;
                            belt(c, S, x0, y0, x1, y1, 46, t);
                            const kinds = [
                                [
                                    'raw',
                                    15,
                                ],
                                [
                                    'cut',
                                    17,
                                ],
                                [
                                    'boiled',
                                    17,
                                ],
                                [
                                    'half',
                                    17,
                                ],
                                [
                                    'perfect',
                                    17,
                                ],
                                [
                                    'raw',
                                    22,
                                ],
                                [
                                    'perfect',
                                    13,
                                ],
                                [
                                    'boiled',
                                    20,
                                ],
                                [
                                    'half',
                                    15,
                                ],
                                [
                                    'cut',
                                    20,
                                ],
                            ];
                            const total = x1 - x0 + (y1 - y0);
                            kinds.forEach((k, i) => {
                                const s =

                                    30;

                                const [
                                    x,
                                    y,
                                ] = onPath(x0, y0, x1, y1, s);
                                c.save();
                                c.translate(x, y - 4);
                                potato(
                                    c,
                                    {...S, hop: S.hop * 0.5},
                                    {kind: k[0], r: k[1], ph: i * 1.3},
                                    t,
                                );

                            });

                        l: 'Cabbage leaves',
                        d: (c, t) =>

                        d: (c, t) =>

                    {l: 'Gull walking', d: (c, t) => gull(c, S, {mode: 'walk'}, t)},
                    {l: 'Gull flying', d: (c, t) => gull(c, S, {mode: 'fly'}, t)},
                    {
                        l: 'Gull carrying potato',
                        h: CH + 14,
                        d: (c, t) => {
                            c.save();
                            c.translate(0, -14);
                            gull(c, S, {mode: 'carry'}, t);
                            c.restore();
                        },
                    },
                    {sec: 'Restaurant, hopper and icons'},
                    {
                        l: 'Restaurant counter + heat lamp',
                        w: 3,
                        d: (c, t) => {
                            c.translate(0, -4);
                            c.scale(1.1, 1.1);
                            restaurant(c, S, t);
                        },
                    },
                    {l: 'Drop-chute hopper', d: (c, t) => hopper(c, S, t)},
                    {l: 'Coin', d: (c, t) => coin(c, S, t)},
                    {l: 'Star', d: (c, t) => star(c, S, t)},
                    {l: 'Wrench', d: (c, t) => wrench(c, S, t)},

            function layout(items) {
                let x = 0,
                    y = 0,
                    rowH = 0;
                const out = [];
                for (const it of items) {
                    if (it.sec) {
                        if (x > 0) {
                            y += rowH + 10;
                        }
                        x = 0;
                        rowH = 0;
                        out.push({sec: it.sec, y: y + 6});
                        y += 38;
                        continue;
                    }
                    const w = (it.w || 1) * U,
                        h = it.h || CH;
                    if (x + w > W + 1) {
                        y += rowH + 10;
                        x = 0;
                        rowH = 0;
                    }
                    out.push({...it, x, y, pw: w, ph: h});
                    x += w + 0;
                    rowH = Math.max(rowH, h);
                    x += 0;
                }
                return {cells: out, height: y + rowH + 16};
            }
            function grassTex(S, w, h, dpr) {
                const g = document.createElement('canvas');
                g.width = w * dpr;
                g.height = h * dpr;
                const c = g.getContext('2d');
                c.scale(dpr, dpr);
                const [
                    base,
                    dk,
                    lt,
                ] = S.grass;
                c.fillStyle = base;
                c.fillRect(0, 0, w, h);
                let sd = 7;
                const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
                if (S.id === 'bright') {
                    c.fillStyle = dk;
                    for (let y = 0; y < h; y += 60) c.fillRect(0, y, w, 30);
                }
                if (S.id === 'flat') {
                    c.fillStyle = lt;
                    c.globalAlpha = 0.35;
                    for (let i = 0; i < 60; i++) {
                        c.beginPath();
                        c.arc(rnd() * w, rnd() * h, 6 + rnd() * 14, 0, TAU);
                        c.fill();
                    }
                    c.globalAlpha = 1;
                } else
                    for (let i = 0; i < 900; i++) {
                        const x = rnd() * w,
                            y = rnd() * h;
                        c.strokeStyle = rnd() < 0.5 ? dk : lt;
                        c.lineWidth = S.id === 'bright' ? 3 : 1.6;
                        c.lineCap = 'round';
                        c.beginPath();
                        c.moveTo(x, y);
                        c.lineTo(x - 2, y - 6);
                        c.moveTo(x, y);
                        c.lineTo(x + 3, y - 5);
                        c.stroke();
                    }
                return g;
            }

            /* ---------- boot ---------- */
            const tabs = document.getElementById('tabs'),
                main = document.getElementById('main');
            const dpr = Math.min(2, window.devicePixelRatio || 1);
            const views = {};
            let active = null,
                paused = false,
                tPause = 0,
                t0 = performance.now();
            for (const id in STYLES) {
                const S = STYLES[id];
                S.dpr = dpr;
                const sec = document.createElement('section');
                sec.className = 'sty';
                sec.id = 's-' + id;
                sec.innerHTML = `<p class="desc"><b>${S.tab}.</b> ${S.desc}</p><div style="color:#a89c88;font-size:12px">${S.paletteNote}</div><div class="pal">${S.swatches
                    .map(
                        ([
                            n,
                            h,
                        ]) => `<div class="sw"><i style="background:${h}"></i>${n}<br>${h}</div>`,
                    )
                    .join('')}</div>`;
                const cv = document.createElement('canvas');
                sec.appendChild(cv);
                main.appendChild(sec);
                const lay = layout(sheet(S));
                cv.width = W * dpr;
                cv.height = lay.height * dpr;
                cv.style.width = W + 'px';
                cv.style.height = lay.height + 'px';
                views[id] = {S, cv, lay, grass: grassTex(S, W, lay.height, dpr), sec};
                const b = document.createElement('button');
                b.textContent = S.tab;
                b.onclick = () => show(id);
                tabs.appendChild(b);
                b.dataset.id = id;
            }
            const sp = document.createElement('span');
            sp.className = 'sp';
            tabs.appendChild(sp);
            const pb = document.createElement('button');
            pb.id = 'pause';
            pb.textContent = 'Pause';
            pb.onclick = () => {
                paused = !paused;
                pb.textContent = paused ? 'Play' : 'Pause';
                if (!paused) t0 = performance.now() - tPause * 1000;
            };
            tabs.appendChild(pb);
            function show(id) {
                active = id;
                location.hash = id;
                for (const k in views) views[k].sec.classList.toggle('on', k === id);
                [...tabs.querySelectorAll('button[data-id]')].forEach((b) =>
                    b.classList.toggle('on', b.dataset.id === id),
                );
            }
            window.showStyle = show;
            function render(v, t) {
                const {S, cv, lay, grass} = v,
                    c = cv.getContext('2d');
                c.setTransform(dpr, 0, 0, dpr, 0, 0);
                c.clearRect(0, 0, W, lay.height);
                c.drawImage(grass, 0, 0, W, lay.height);
                for (const it of lay.cells) {
                    if (it.sec) {
                        txt(c, S, it.sec, 6, it.y + 14, 17, S.text, 'left');
                        c.fillStyle = S.cellLine;
                        c.fillRect(6, it.y + 27, W - 12, 2);
                        continue;
                    }
                    const x = it.x + 3,
                        y = it.y,
                        w = it.pw - 6,
                        h = it.ph;
                    c.fillStyle = S.cell;
                    c.beginPath();
                    c.roundRect(x, y, w, h, 12);
                    c.fill();
                    c.strokeStyle = S.cellLine;
                    c.lineWidth = S.id === 'bright' ? 3 : 1;
                    c.stroke();
                    c.save();
                    c.beginPath();
                    c.roundRect(x, y, w, h, 12);
                    c.clip();
                    c.save();
                    c.translate(x + w / 2, y + (h - 26) / 2 + 6);
                    try {
                        it.d(c, t);
                    } catch (e) {
                        console.error(it.l, e);
                    }
                    c.restore();
                    c.restore();
                    const tw = c.measureText(it.l).width;
                    c.font = `${S.fontW} 12px ${S.font}`;
                    const lw = c.measureText(it.l).width + 16;
                    c.fillStyle = S.chip;
                    c.beginPath();
                    c.roundRect(x + w / 2 - lw / 2, y + h - 23, lw, 18, 9);
                    c.fill();
                    txt(c, S, it.l, x + w / 2, y + h - 14, 12, '#fff');
                }
            }
            function frame(now) {
                const t = paused ? tPause : (now - t0) / 1000;
                if (!paused) tPause = t;
                if (active) render(views[active], t);
                requestAnimationFrame(frame);
            }
            show(
                (location.hash || '#cozy').slice(1) in STYLES
                    ? (location.hash || '#cozy').slice(1)
                    : 'cozy',
            );
            window.addEventListener('hashchange', () => {
                const h = location.hash.slice(1);
                if (h in STYLES && h !== active) show(h);
            });
            requestAnimationFrame(frame);
